<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sibered — Verify ownership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-row"><img src="logo.png" alt="Sibered"><span class="wordmark">Sibered</span></div>
    <nav class="nav">
      <a href="index.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span><span class="label">Home</span></a>
      <a href="websites.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z"/></svg></span><span class="label">My websites</span></a>
      <a href="add-website.html" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="label">New scan</span></a>
      <a href="reports.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3"/><path d="M9 12h6M9 16h6"/></svg></span><span class="label">Reports</span></a>
      <a href="billing.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9h.01M18 15h.01"/></svg></span><span class="label">Usage and billing</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="settings.html" class="account-link"><div class="avatar">U</div><span class="label">Account and settings</span></a>
      <button class="collapse-btn" id="collapseBtn"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span><span class="label">Collapse</span></button>
    </div>
  </aside>
  <main class="main" style="display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 72px);">
    <div class="card" style="max-width:480px; width:100%;">
      <h1 style="font-size:24px;">Verify ownership</h1>
      <p class="subtitle">acmeshop.com &middot; choose one method</p>

      <div class="tabs">
        <button class="tab active" data-method="meta">Meta tag</button>
        <button class="tab" data-method="html">HTML file</button>
        <button class="tab" data-method="dns">DNS record</button>
      </div>

      <p style="font-size:13px; color:var(--muted); margin-bottom:8px;">Add this to your site:</p>
      <div class="code-box">
        <span id="codeText">&lt;meta name="sibered-verify" content="vs_8f2a...c91"&gt;</span>
      </div>

      <div style="display:flex; align-items:center; gap:7px; font-size:12px; color:#fde047; margin-bottom:22px;">
        <span class="icon" style="width:15px;height:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>Token expires in 24 hours
      </div>

      <button class="btn-primary" id="verifyBtn" style="width:100%; justify-content:center;">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M5 9a7 7 0 0112-3.5M19 15a7 7 0 01-12 3.5"/></svg></span>Verify now
      </button>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
