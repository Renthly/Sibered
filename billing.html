<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sibered — Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-row"><img src="logo.png" alt="Sibered"><span class="wordmark">Sibered</span></div>
    <nav class="nav">
      <a href="index.html"><span class="icon">⌂</span><span class="label">Home</span></a>
      <a href="websites.html"><span class="icon">🌐</span><span class="label">My websites</span></a>
      <a href="add-website.html"><span class="icon">+</span><span class="label">New scan</span></a>
      <a href="reports.html"><span class="icon">▤</span><span class="label">Reports</span></a>
      <a href="billing.html" class="active"><span class="icon">$</span><span class="label">Usage and billing</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="settings.html" class="account-link"><div class="avatar">U</div><span class="label">Account and settings</span></a>
      <button class="collapse-btn" id="collapseBtn"><span>‹</span><span class="label">Collapse</span></button>
    </div>
  </aside>

  <main class="main" style="max-width:680px;">
    <h1 style="margin-bottom:20px;">Usage and billing</h1>

    <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
      <div>
        <div class="stat-label">Current plan</div>
        <div style="font-size:17px; font-weight:500;">Starter &middot; $5.99/mo</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.4); margin-top:2px;">Renews Oct 8 &middot; 4 of 6 scans used</div>
      </div>
      <button class="btn-primary">⚡ Emergency scan &middot; $1.99</button>
    </div>

    <h2 style="font-size:18px; margin-bottom:12px;">Plans</h2>
    <div class="grid-3">
      <div class="card">
        <div style="font-size:13px; font-weight:500;">Starter</div>
        <div style="font-size:22px; font-weight:600; margin:4px 0;">$5.99</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5);">6 scans / mo</div>
      </div>
      <div class="card plan-card popular">
        <span class="popular-tag">Most popular</span>
        <div style="font-size:13px; font-weight:500; margin-top:4px;">Pro</div>
        <div style="font-size:22px; font-weight:600; margin:4px 0;">$13.99</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5);">14 scans / mo</div>
      </div>
      <div class="card">
        <div style="font-size:13px; font-weight:500;">Team</div>
        <div style="font-size:22px; font-weight:600; margin:4px 0;">$29.99</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5);">30 scans / mo</div>
      </div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
